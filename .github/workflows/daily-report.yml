name: AppRadar Daily Store Telemetry & AI Pipeline

on:
  workflow_dispatch:
  schedule:
    # 02:17 UTC = 08:17 AM Bangladesh time
    - cron: "17 2 * * *"
    # 14:17 UTC = 08:17 PM Bangladesh time (dual schedule eliminates 24h single-point-of-failure delays)
    - cron: "17 14 * * *"

jobs:
  telemetry-and-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Verify Secret Configuration
        env:
          CHECK_RESEND: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
          CHECK_EMAIL: ${{ secrets.REPORT_TO_EMAIL || vars.REPORT_TO_EMAIL }}
          CHECK_GEMINI: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          CHECK_SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          CHECK_SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          CHECK_SUPABASE_ANON: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          echo "=== Secrets & Variables Availability Check ==="
          if [ -n "$CHECK_RESEND" ]; then echo "✅ RESEND_API_KEY is detected"; else echo "⚠️ RESEND_API_KEY is MISSING"; fi
          if [ -n "$CHECK_EMAIL" ]; then echo "✅ REPORT_TO_EMAIL is detected"; else echo "⚠️ REPORT_TO_EMAIL is MISSING"; fi
          if [ -n "$CHECK_GEMINI" ]; then echo "✅ GEMINI_API_KEY is detected"; else echo "⚠️ GEMINI_API_KEY is MISSING"; fi
          if [ -n "$CHECK_SUPABASE_URL" ]; then echo "✅ SUPABASE_URL is detected"; else echo "⚠️ SUPABASE_URL is MISSING"; fi
          if [ -n "$CHECK_SUPABASE_SERVICE" ]; then echo "✅ SUPABASE_SERVICE_ROLE_KEY is detected"; else echo "❌ SUPABASE_SERVICE_ROLE_KEY is MISSING"; fi
          if [ -n "$CHECK_SUPABASE_ANON" ]; then echo "✅ SUPABASE_ANON_KEY is detected"; else echo "⚠️ SUPABASE_ANON_KEY is MISSING"; fi

      - name: Run Live AppRadar Pipeline
        run: npm run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL || vars.REPORT_TO_EMAIL }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL || vars.REPORT_FROM_EMAIL }}
